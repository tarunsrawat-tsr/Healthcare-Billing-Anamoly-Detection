name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: the pipeline is CPU-bound and there is
# no value in finishing a build for a commit that is already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      # The suite is hermetic: it uses tests/fixtures/tiny_claims.csv and the
      # committed stratified sample. No network, no `make data`, no secrets.
      - name: Test
        run: python -m pytest --cov=claimsight --cov-report=term-missing

      - name: Smoke-test the CLI against the committed sample
        run: |
          python -m claimsight.cli report data/sample/cms_inpatient_fy2016_sample.csv \
            --no-forest --top 5

  api-contract:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Boot the service and hit /health
        run: |
          python -m uvicorn claimsight.api.main:app --host 127.0.0.1 --port 8000 &
          SERVER=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /tmp/health.json; then
              echo "healthy after ${i}s"; cat /tmp/health.json; break
            fi
            sleep 1
            [ "$i" = 60 ] && { echo "server never became healthy"; kill $SERVER; exit 1; }
          done
          curl -sf http://127.0.0.1:8000/summary | head -c 400; echo
          curl -sf "http://127.0.0.1:8000/outliers?limit=3" | head -c 400; echo
          curl -sf http://127.0.0.1:8000/openapi.json -o /dev/null -w "openapi=%{http_code}\n"
          kill $SERVER
