name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: the pipeline is CPU-bound and there is
# no value in finishing a build for a commit that is already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      # The suite is hermetic: it uses tests/fixtures/tiny_claims.csv and the
      # committed stratified sample. No network, no `make data`, no secrets.
      - name: Test
        run: python -m pytest --cov=claimsight --cov-report=term-missing

      # End-to-end smoke of the operational loop, not just the report: score the
      # committed sample, persist a run, list it, then drift-check the same file
      # against its own baseline (which must exit 0 with PSI ~ 0).
      - name: Smoke-test the CLI against the committed sample
        run: |
          SAMPLE=data/sample/cms_inpatient_fy2016_sample.csv
          python -m claimsight.cli report "$SAMPLE" --no-forest --top 5
          python -m claimsight.cli report "$SAMPLE" --no-forest --save
          python -m claimsight.cli runs
          python -m claimsight.cli drift "$SAMPLE" --json artifacts/drift.json
          test -f artifacts/drift.json

  api-contract:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Boot the service and hit /health
        run: |
          python -m uvicorn claimsight.api.main:app --host 127.0.0.1 --port 8000 &
          SERVER=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /tmp/health.json; then
              echo "healthy after ${i}s"; cat /tmp/health.json; break
            fi
            sleep 1
            [ "$i" = 60 ] && { echo "server never became healthy"; kill $SERVER; exit 1; }
          done
          curl -sf http://127.0.0.1:8000/summary | head -c 400; echo
          curl -sf "http://127.0.0.1:8000/outliers?limit=3" | head -c 400; echo
          curl -sf http://127.0.0.1:8000/openapi.json -o /dev/null -w "openapi=%{http_code}\n"

          # The dashboard must serve, and must not reach outside this origin.
          curl -sf http://127.0.0.1:8000/dashboard -o /tmp/dash.html
          grep -q "<title>claimsight" /tmp/dash.html
          if grep -Eo "https?://[^\"' )]*" /tmp/dash.html | grep -v "www.w3.org/2000/svg"; then
            echo "dashboard references an external URL"; exit 1
          fi
          echo "dashboard ok: $(wc -c < /tmp/dash.html) bytes, no external references"

          curl -sf "http://127.0.0.1:8000/distribution?column=markup_ratio&bins=20" | head -c 200; echo
          curl -sf http://127.0.0.1:8000/reference -o /dev/null -w "reference=%{http_code}\n"
          # The column parameter is a whitelist interpolated into SQL.
          curl -s -o /dev/null -w "bad-column=%{http_code}\n" \
            "http://127.0.0.1:8000/distribution?column=provider_name" | grep -q "422"
          kill $SERVER
